<!DOCTYPE html>
<html lang ="ko">
    <head>
        <!-- 네이밍 컨벤션은 html이라 일단 케밥 케이스(kebab-case)로 작성함! -->
        <meta charset="UTF-8"/>
        <!--웹 페이지 너비를 현재 기기 화면 너비에 맞춰 조정, initial-scale은 초기 화면 확대/축소 배율 값 -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>りょこうそ —　ログイン</title>
        <style>
        /* 브라우저 양식 초기화 코드 */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        a { text-decoration: none; color: inherit; }
        button, input { font-family: inherit; }

        /* 디자인 토큰 (피그마) */
        :root {
            --bg:             rgba(255, 186, 37, 0.15);
            --accent:         #FFBA25;
            --accent-hover:   #e6a800;
            --card-bg:        #FFFFFF;
            --card-shadow:    2px 4px 4px rgba(0, 0, 0, 0.25);
            --card-radius:    30px;
            --input-border:   #D9D9D9;
            --input-radius:   15px;
            --placeholder:    #D9D9D9;
            --text-primary:   #000000;
            --text-secondary: #000000;
            --btn-radius:     15px;
            --transition:     0.18s ease;
        }

        /* ─── Page Shell ─────────────────────────────────── */
        body {
            min-height: 100dvh;
            background-color: var(--bg);
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 16px 60px;
        }

        /* ─── Page switcher (tab nav) ────────────────────── */
        /* Hidden — state is managed by JS */
        .page { display: none; width: 100%; max-width: 512px; }
        .page.active { display: block; }

        /* ─── Back link ──────────────────────────────────── */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 20px;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 28px;
            cursor: pointer;
            transition: opacity var(--transition);
        }
        .back-link:hover { opacity: .65; }

        /* ─── Card ───────────────────────────────────────── */
        .card {
            width: 100%;
            background: var(--card-bg);
            box-shadow: var(--card-shadow);
            border-radius: var(--card-radius);
            padding: 48px 57px 52px;
        }

        /* ─── Card Header ────────────────────────────────── */
        .card-title {
            font-size: 40px;
            font-weight: 600;
            line-height: 1.2;
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .card-subtitle {
            font-size: 20px;
            font-weight: 400;
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 36px;
            line-height: 1.4;
        }

        /* ─── Field Group ────────────────────────────────── */
        .field-group {
            margin-bottom: 20px;
        }

        .field-label {
            font-size: 18px;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: block;
        }

        .field-input {
            width: 100%;
            height: 68px;
            padding: 0 20px;
            font-size: 20px;
            font-weight: 500;
            color: var(--text-primary);
            background: var(--card-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--input-radius);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .field-input::placeholder {
            color: var(--placeholder);
            font-weight: 500;
        }

        .field-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 186, 37, 0.20);
        }

        /* ─── Options Row (login page) ───────────────────── */
        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 0 24px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 400;
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .forgot-link {
            font-size: 16px;
            font-weight: 400;
            color: var(--accent);
            transition: opacity var(--transition);
        }
        .forgot-link:hover { opacity: .7; }

        /* ─── Primary Button ─────────────────────────────── */
        .btn-primary {
            width: 100%;
            height: 66px;
            background: var(--accent);
            border: 1px solid var(--input-border);
            border-radius: var(--btn-radius);
            font-size: 20px;
            font-weight: 700;
            color: #FFFFFF;
            cursor: pointer;
            transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
            margin-bottom: 0;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(255, 186, 37, .35);
        }
        .btn-primary:active { transform: translateY(0); }

        /* ─── Outline Button (회원가입 페이지 하단) ──────── */
        .btn-outline {
            height: 56px;
            border: 2px solid var(--accent);
            border-radius: var(--btn-radius);
            background: transparent;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
        }

        /* ─── Bottom Text Link ───────────────────────────── */
        .bottom-text {
            text-align: center;
            font-size: 20px;
            font-weight: 400;
            color: var(--text-primary);
            margin-top: 24px;
            line-height: 1.5;
        }

        .bottom-link {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            cursor: pointer;
            transition: opacity var(--transition);
        }
        .bottom-link:hover { opacity: .7; }

        /* ─── Signup: two-button row ─────────────────────── */
        .btn-row {
            display: flex;
            gap: 22px;
            margin-top: 28px;
        }

        .btn-row .btn-half {
            flex: 1;
            height: 56px;
            border-radius: var(--btn-radius);
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: background var(--transition), color var(--transition), transform var(--transition);
        }

        .btn-half.inactive {
            background: var(--input-border);
            border: 1px solid #FFFFFF;
            color: var(--text-primary);
        }
        .btn-half.inactive:hover { background: #c8c8c8; }

        .btn-half.active-btn {
            background: var(--accent);
            border: 1px solid var(--input-border);
            color: #FFFFFF;
        }
        .btn-half.active-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* ─── Responsive ─────────────────────────────────── */
        @media (max-width: 560px) {
            .card { padding: 40px 28px 44px; }
            .card-title { font-size: 32px; }
            .card-subtitle { font-size: 16px; }
            .field-input { height: 58px; font-size: 17px; }
            .btn-primary { height: 58px; }
            .options-row { flex-wrap: wrap; gap: 10px; }
        }

        </style>
    </head>
    <body>
        <div class="page active" id="page-login">

            <span class="back-link">← ホームへ戻る</span>

            <!--카드형 로그인 페이지 타이틀-->
            <div class="card">
                <h1 class="card-title">ログイン</h1>
                <p class="card-subtitle">ログインして旅行プランを作成しましょう</p>

            <!--이메일 인풋-->
            <!--for="login-email" - id="login-email" 연결!
            autocomplete="email": 이메일 주소 자동 완성 -->
            <div class="field-group">
                <label class="field-label" for="login-email">メールアドレス（ID）</label>
                <input 
                    class="field-input"
                    type="email"
                    id="login-email"
                    placeholder="メールアドレス"
                    autocomplete="email" 
                /> 
            </div>

            <!--비밀번호 인풋-->
            <!--for="login-pw" - id="login-pw" 연결!
            autocomplete="current-password": 기존 비밀번호 자동 완성 -->
            <div class="field-group">
                <label class="field-label" for="login-pw">パスワード</label>
                <input
                    class="field-input"
                    type="password"
                    id="login-pw"
                    placeholder="パスワード"
                    autocomplete="current-password"
                /> 
            </div>

            <!--로그인 상태 유지 토글 & 비밀번호 찾기 링크-->
            <div class="options-row">
                <label class="checkbox-label">
                    <input type="checkbox"/>
                    ログイン状態を保持する
                </label>
                <a class="forgot-link" href="#">パスワードをお忘れの方</a>
            </div>

            <!--로그인 버튼-->
            <!--btn-primary: 가장 중요한 행동 / btn-secondary: 보조 행동 / btn-outline: 가벼운 행동 / btn-danger: 위험 행동 -->
            <button class="btn-primary" type="button">ログイン</button>

            <!--회원가입 안내 및 링크-->
            <div class="bottom-text">
                アカウントをお持ちでない方はこちら<br>
                <a class="bottom-link" href="#">新規登録</a>
            </div>
        </div>
    </body>
</html>
