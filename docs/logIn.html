<!DOCTYPE html>
<html lang="ko">

<head>
    <!-- 네이밍 컨벤션은 html이라 일단 케밥 케이스(kebab-case)로 작성함! -->
    <meta charset="UTF-8" />
    <!--웹 페이지 너비를 현재 기기 화면 너비에 맞춰 조정, initial-scale은 초기 화면 확대/축소 배율 값 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/logInCSS.css">
    <script src="js/config.js"></script>
    <title>りょこうそ —　ログイン</title>
</head>

<body>
    <div class="page active" id="page-login">

        <a class="back-link" href="index.html">← ホームへ戻る</a>

        <!--카드형 로그인 페이지 타이틀-->
        <div class="card">
            <h1 class="card-title">ログイン</h1>
            <p class="card-subtitle">ログインして旅行プランを作成しましょう</p>

            <!--이메일 인풋-->
            <!--for="login-email" - id="login-email" 연결, autocomplete="email": 이메일 주소 자동 완성 -->
            <div class="field-group">
                <label class="field-label" for="login-email">メールアドレス（ID）</label>
                <input class="field-input" type="email" id="login-email" placeholder="メールアドレス" autocomplete="email" />
            </div>

            <!--비밀번호 인풋-->
            <!--for="login-pw" - id="login-pw" 연결, autocomplete="current-password": 기존 비밀번호 자동 완성 -->
            <div class="field-group">
                <label class="field-label" for="login-pw">パスワード</label>
                <div class="input-with-icon">
                    <input class="field-input" type="password" id="login-pw" placeholder="パスワード"
                        autocomplete="current-password" />
                    <button type="button" class="toggle-pw" id="toggle-pw" aria-label="パスワードを表示">👁</button>
                </div>
            </div>
            <p class="login-error" id="login-error"></p>

            <!--로그인 상태 유지 토글 & 비밀번호 찾기 링크-->
            <div class="options-row">
                <label class="checkbox-label">
                    <input type="checkbox" id="keep-login" />
                    ログイン状態を保持する
                </label>
                <a class="forgot-link" href="reset-password.html">パスワードをお忘れの方</a>
            </div>

            <!--로그인 버튼-->
            <!--btn-primary: 가장 중요한 행동 / btn-secondary: 보조 행동 / btn-outline: 가벼운 행동 / btn-danger: 위험 행동 -->
            <button class="btn-primary" type="button" id="login-btn">ログイン</button>

            <!--회원가입 안내 및 링크-->
            <div class="bottom-text">
                アカウントをお持ちでない方はこちら<br>
                <a class="bottom-link" href="signup.html">新規登録</a>
            </div>
        </div>
        <script src="js/loginJS.js"></script>
</body>

</html>
