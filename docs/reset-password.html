<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/logInCSS.css">
    <script src="js/config.js"></script>
    <title>りょこうそ — パスワード再設定</title>
</head>

<body>
    <div class="page active" id="page-reset">
        <a class="back-link" href="logIn.html">← ログインへ戻る</a>

        <div class="card">
            <h1 class="card-title">パスワード再設定</h1>
            <p class="card-subtitle">メールアドレスと新しいパスワードを入力してください</p>

            <div class="field-group">
                <label class="field-label" for="reset-email">メールアドレス</label>
                <input class="field-input" type="email" id="reset-email" placeholder="メールアドレス" />
            </div>

            <div class="field-group">
                <label class="field-label" for="reset-pw">新しいパスワード</label>
                <input class="field-input" type="password" id="reset-pw" placeholder="新しいパスワード" />
            </div>

            <button class="btn-primary" type="button" id="reset-btn">パスワードを変更</button>
        </div>
    </div>
    <script src="js/resetPasswordJS.js"></script>
</body>

</html>
